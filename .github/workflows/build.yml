name: Build

# Tests, a debug APK and the Windows installer for every push and pull request.
# Pushing a version tag (e.g. v1.2) also publishes a GitHub Release with the APK and the installer attached.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --console=plain :core:test testDebugUnitTest

      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            core/build/reports/tests/test/
            app/build/reports/tests/testDebugUnitTest/

      - name: Build debug APK
        run: |
          ./gradlew --console=plain assembleDebug
          name="VaultCapture-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}.apk"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then name="VaultCapture-$GITHUB_REF_NAME.apk"; fi
          cp app/build/outputs/apk/debug/app-debug.apk "$name"
          echo "APK=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$APK" --title "Vault Capture $GITHUB_REF_NAME" --generate-notes

  desktop:
    runs-on: windows-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Windows installer
        shell: bash
        run: |
          ./gradlew --console=plain :desktop:packageMsi
          name="VaultCapture-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}.msi"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then name="VaultCapture-$GITHUB_REF_NAME.msi"; fi
          cp desktop/build/compose/binaries/main/msi/*.msi "$name"
          echo "MSI=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MSI }}
          path: ${{ env.MSI }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$MSI"
