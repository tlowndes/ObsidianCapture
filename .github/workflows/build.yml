name: Build

# Tests, a debug APK and the Windows installer for every push and pull request.
# Pushing a version tag (e.g. v1.2) also publishes a GitHub Release with the APK and the installer attached.
# If the release already exists (made on GitHub first), the files are added to it.
# Run it by hand with a tag to rebuild and re-attach the files to that release.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach the APK and installer to (e.g. v1.7)"
        required: true

env:
  RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # compileSdk 37 is not on the runner image. AGP 9.3 resolves it as platforms/android-37.0
      # and uses build-tools 36.0.0.
      - name: Android SDK platform 37
        run: |
          sdkmanager="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Unit tests
        run: ./gradlew --console=plain :core:test :desktop:test testDebugUnitTest

      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            core/build/reports/tests/test/
            app/build/reports/tests/testDebugUnitTest/

      - name: Build debug APK
        run: |
          ./gradlew --console=plain assembleDebug
          name="VaultCapture-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}.apk"
          if [[ -n "$RELEASE_TAG" ]]; then name="VaultCapture-$RELEASE_TAG.apk"; fi
          cp app/build/outputs/apk/debug/app-debug.apk "$name"
          echo "APK=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}
          if-no-files-found: error

      - name: Release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK" --title "Vault Capture $RELEASE_TAG" --generate-notes
          fi

  desktop:
    runs-on: windows-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Windows installer
        shell: bash
        run: |
          ./gradlew --console=plain :desktop:packageMsi
          name="VaultCapture-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}.msi"
          if [[ -n "$RELEASE_TAG" ]]; then name="VaultCapture-$RELEASE_TAG.msi"; fi
          cp desktop/build/compose/binaries/main/msi/*.msi "$name"
          echo "MSI=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MSI }}
          path: ${{ env.MSI }}
          if-no-files-found: error

      - name: Attach to release
        if: env.RELEASE_TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "$MSI" --clobber
